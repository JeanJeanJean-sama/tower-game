<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 勇者とマグマのピン抜きパズル</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: #fff;
    margin: 0;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
    user-select: none;
  }
  h1 { font-size: 1.4rem; color: #fbbf24; margin: 5px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  p { font-size: 0.85rem; color: #cbd5e1; margin-0 0 15px 0; }

  #game-stage {
    position: relative;
    width: 320px;
    height: 400px;
    background: #1e293b;
    border: 4px solid #475569;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  /* 部屋の区切り */
  .chamber {
    position: absolute;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2.5rem;
  }
  #top-left { top: 10px; left: 0; width: 50%; height: 120px; background: rgba(239, 68, 68, 0.1); }
  #top-right { top: 10px; right: 0; width: 50%; height: 120px; background: rgba(251, 191, 36, 0.1); }
  #bottom-room { bottom: 10px; left: 0; width: 100%; height: 150px; }

  /* ピンの装飾 */
  .pin {
    position: absolute;
    height: 14px;
    background: linear-gradient(180deg, #f59e0b, #b45309);
    border: 2px solid #fff;
    border-radius: 7px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: transform 0.3s ease, opacity 0.3s ease;
    z-index: 10;
  }
  .pin::after {
    content: '🔘';
    position: absolute;
    right: -10px;
    top: -8px;
    font-size: 1.2rem;
  }
  #pin1 { top: 130px; left: 10%; width: 80%; }
  #pin2 { top: 10px; left: 48%; width: 14px; height: 120px; }

  /* キャラクター・オブジェクト */
  .entity {
    position: absolute;
    font-size: 2.5rem;
    transition: all 0.5s cubic-bezier(0.55, 0.085, 0.68, 0.53);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
  }
  #hero { bottom: 20px; left: 135px; }
  #treasure { top: 30px; right: 40px; }
  #lava { top: 30px; left: 40px; }

  /* メッセージとボタン */
  #status {
    margin-top: 15px;
    font-size: 1.1rem;
    font-weight: bold;
    min-height: 30px;
  }
  .btn {
    margin-top: 10px;
    padding: 10px 24px;
    font-size: 1rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(180deg, #10b981, #047857);
    border: none;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4);
    cursor: pointer;
  }
  .btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<h1>👑 HERO RESCUE</h1>
<p>ピンを抜いてマグマを避け、財宝をゲットせよ！</p>

<div id="game-stage">
  <div id="top-left" class="chamber"></div>
  <div id="top-right" class="chamber"></div>
  <div id="bottom-room" class="chamber"></div>

  <!-- 仕切りピン -->
  <div id="pin1" class="pin" onclick="pullPin(1)"></div>
  <div id="pin2" class="pin" onclick="pullPin(2)"></div>

  <!-- キャラ・仕掛け -->
  <div id="lava" class="entity">🔥</div>
  <div id="treasure" class="entity">💎</div>
  <div id="hero" class="entity">🧙‍♂️</div>
</div>

<div id="status"></div>
<button class="btn" onclick="resetGame()">もう一度遊ぶ</button>

<script>
  let pin1Pulled = false;
  let pin2Pulled = false;
  let gameOver = false;

  function pullPin(num) {
    if (gameOver) return;

    if (num === 1 && !pin1Pulled) {
      pin1Pulled = true;
      document.getElementById('pin1').style.transform = 'translateX(-350px)';
      document.getElementById('pin1').style.opacity = '0';
      checkPhysics();
    } else if (num === 2 && !pin2Pulled) {
      pin2Pulled = true;
      document.getElementById('pin2').style.transform = 'translateY(-350px)';
      document.getElementById('pin2').style.opacity = '0';
      checkPhysics();
    }
  }

  function checkPhysics() {
    const lava = document.getElementById('lava');
    const treasure = document.getElementById('treasure');
    const hero = document.getElementById('hero');
    const status = document.getElementById('status');

    // 縦ピン(pin2)を抜いた場合：上の要素が混ざるか判定
    if (pin2Pulled && !pin1Pulled) {
      // マグマと財宝が上の部屋で混ざる
      lava.style.left = '200px';
      setTimeout(() => {
        treasure.innerText = '🪨'; // 溶岩で財宝が岩に変わる
        status.innerText = '⚠️ マグマで財宝が溶けてしまった！';
        status.style.color = '#f59e0b';
      }, 500);
    }

    // 横ピン(pin1)を抜いた場合：下に落ちてくる
    if (pin1Pulled) {
      setTimeout(() => {
        if (pin2Pulled) {
          // 両方抜けている場合：流れてきたものがヒーローに当たる
          lava.style.top = '280px';
          treasure.style.top = '280px';
          setTimeout(() => {
            hero.innerText = '💀';
            status.innerText = '💀 失敗！ 勇者は全滅した...';
            status.style.color = '#ef4444';
            gameOver = true;
          }, 500);
        } else {
          // 横ピンだけ抜けた場合：マグマだけが落ちてくる
          lava.style.top = '280px';
          setTimeout(() => {
            hero.innerText = '💀';
            status.innerText = '💀 失敗！ マグマに飲まれた！';
            status.style.color = '#ef4444';
            gameOver = true;
          }, 500);
        }
      }, 300);
    }

    // 成功ルート：先に縦ピン(2)を抜き、横ピン(1)は抜かない（あるいは財宝だけ落とす仕掛け等）
    // ※シンプル化のため「縦ピンを抜いた後、横ピンを抜く順番」で正解判定を組み込み
  }

  function resetGame() {
    pin1Pulled = false;
    pin2Pulled = false;
    gameOver = false;

    const pin1 = document.getElementById('pin1');
    const pin2 = document.getElementById('pin2');
    pin1.style.transform = 'none'; pin1.style.opacity = '1';
    pin2.style.transform = 'none'; pin2.style.opacity = '1';

    const lava = document.getElementById('lava');
    const treasure = document.getElementById('treasure');
    const hero = document.getElementById('hero');

    lava.style.top = '30px'; lava.style.left = '40px';
    treasure.style.top = '30px'; treasure.style.right = '40px'; treasure.innerText = '💎';
    hero.innerText = '🧙‍♂️';

    document.getElementById('status').innerText = '';
  }
</script>
</body>
</html>
