<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 勇者とマグマのピン抜きパズル</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: #fff;
    margin: 0;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
    user-select: none;
  }
  h1 { font-size: 1.4rem; color: #fbbf24; margin: 5px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  p { font-size: 0.85rem; color: #cbd5e1; margin: 0 0 15px 0; }

  #game-stage {
    position: relative;
    width: 320px;
    height: 400px;
    background: #1e293b;
    border: 4px solid #475569;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  /* ピンの装飾 */
  .pin {
    position: absolute;
    height: 14px;
    background: linear-gradient(180deg, #f59e0b, #b45309);
    border: 2px solid #fff;
    border-radius: 7px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: transform 0.4s ease, opacity 0.4s ease;
    z-index: 10;
  }
  .pin::after {
    content: '🔘';
    position: absolute;
    right: -10px;
    top: -8px;
    font-size: 1.2rem;
  }
  /* ピン1：水とマグマを分ける縦ピン */
  #pin1 { top: 20px; left: 48%; width: 14px; height: 120px; }
  /* ピン2：下への落下を防ぐ横ピン */
  #pin2 { top: 140px; left: 10%; width: 80%; }

  /* オブジェクト */
  .entity {
    position: absolute;
    font-size: 2.5rem;
    transition: all 0.6s ease-in-out;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
  }
  #lava { top: 30px; left: 40px; }
  #water { top: 30px; right: 40px; }
  #hero { bottom: 20px; left: 135px; }

  /* メッセージとボタン */
  #status {
    margin-top: 15px;
    font-size: 1.1rem;
    font-weight: bold;
    min-height: 30px;
    text-align: center;
  }
  .btn {
    margin-top: 10px;
    padding: 10px 24px;
    font-size: 1rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(180deg, #10b981, #047857);
    border: none;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4);
    cursor: pointer;
  }
  .btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<h1>👑 HERO RESCUE</h1>
<p>順番を考えてピンを抜き、マグマを無力化せよ！</p>

<div id="game-stage">
  <!-- 仕切りピン -->
  <div id="pin1" class="pin" onclick="pullPin(1)"></div>
  <div id="pin2" class="pin" onclick="pullPin(2)"></div>

  <!-- キャラ・仕掛け -->
  <div id="lava" class="entity">🔥</div>
  <div id="water" class="entity">💧</div>
  <div id="hero" class="entity">🧙‍♂️</div>
</div>

<div id="status"></div>
<button class="btn" onclick="resetGame()">もう一度遊ぶ</button>

<script>
  let pin1Pulled = false;
  let pin2Pulled = false;
  let lavaNeutralized = false;
  let gameOver = false;

  function pullPin(num) {
    if (gameOver) return;

    // 縦ピン（1）を抜く：水とマグマが混ざる
    if (num === 1 && !pin1Pulled) {
      pin1Pulled = true;
      document.getElementById('pin1').style.transform = 'translateY(-350px)';
      document.getElementById('pin1').style.opacity = '0';
      
      const water = document.getElementById('water');
      const lava = document.getElementById('lava');
      
      // 水がマグマ側に移動して固まる
      water.style.left = '40px';
      setTimeout(() => {
        lava.innerText = '🪨'; // 岩（安全）に変化
        water.style.opacity = '0';
        lavaNeutralized = true;
        document.getElementById('status').innerText = '✨ 水でマグマが固まって【岩】になった！';
        document.getElementById('status').style.color = '#38bdf8';
      }, 600);
    } 
    
    // 横ピン（2）を抜く：下が開く
    else if (num === 2 && !pin2Pulled) {
      pin2Pulled = true;
      document.getElementById('pin2').style.transform = 'translateX(-350px)';
      document.getElementById('pin2').style.opacity = '0';

      setTimeout(() => {
        const lava = document.getElementById('lava');
        const hero = document.getElementById('hero');
        lava.style.top = '280px'; // 下へ落下

        setTimeout(() => {
          if (lavaNeutralized) {
            // 正解ルート：岩が落ちてくるだけなので無事クリア！
            hero.innerText = '👑';
            document.getElementById('status').innerText = '🎉 クリア！ 勇者は無事に生き残った！';
            document.getElementById('status').style.color = '#4ade80';
            gameOver = true;
          } else {
            // 失敗ルート：生のマグマが落ちて全滅
            hero.innerText = '💀';
            document.getElementById('status').innerText = '💀 失敗！ 勇者はマグマに飲まれた！';
            document.getElementById('status').style.color = '#ef4444';
            gameOver = true;
          }
        }, 600);
      }, 200);
    }
  }

  function resetGame() {
    pin1Pulled = false;
    pin2Pulled = false;
    lavaNeutralized = false;
    gameOver = false;

    const pin1 = document.getElementById('pin1');
    const pin2 = document.getElementById('pin2');
    pin1.style.transform = 'none'; pin1.style.opacity = '1';
    pin2.style.transform = 'none'; pin2.style.opacity = '1';

    const lava = document.getElementById('lava');
    const water = document.getElementById('water');
    const hero = document.getElementById('hero');

    lava.style.top = '30px'; lava.style.left = '40px'; lava.innerText = '🔥';
    water.style.top = '30px'; water.style.right = '40px'; water.style.left = 'auto'; water.style.opacity = '1';
    hero.innerText = '🧙‍♂️';

    document.getElementById('status').innerText = '';
  }
</script>
</body>
</html>
